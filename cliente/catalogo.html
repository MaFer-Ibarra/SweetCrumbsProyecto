<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Sweet Crumbs</title>
  <meta name="description" content="Explora pasteles, cupcakes, postres individuales y galletas. Filtra por categoría o busca por nombre.">
  <link rel="icon" type="image/svg+xml" href="../img/logo/logo-pastelito.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body data-raiz="../">

  <div id="sc-encabezado"></div>

  <main>

    <!-- SECCION ENCABEZADO, BUSQUEDA Y FILTROS -->
    <section class="portada-catalogo" aria-labelledby="tituloCatalogo">
      <div class="container">
        <div class="encabezado-seccion">
          <span class="sobretitulo">La vitrina completa</span>
          <h1 id="tituloCatalogo">Catálogo</h1>
          <p>Todo lo que horneamos esta semana. Cada pieza se pide tal cual está en la vitrina.</p>
        </div>
        <div class="row g-3 align-items-center">
          <div class="col-md-5 col-lg-4">
            <label for="campoBusqueda" class="visually-hidden">Buscar en el catálogo</label>
            <div class="input-group caja-busqueda">
              <span class="input-group-text" aria-hidden="true"><svg class="icono" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></span>
              <input type="search" class="form-control" id="campoBusqueda" placeholder="Buscar por nombre o ingrediente…" autocomplete="off">
            </div>
          </div>
          <div class="col-md-7 col-lg-8">
            <div class="d-flex flex-wrap gap-2" id="pildorasFiltro" role="group" aria-label="Filtrar por categoría"></div>
          </div>
        </div>
        <p class="contador-catalogo mt-4 mb-0" id="contadorCatalogo" aria-live="polite"></p>
      </div>
    </section>

    <!-- SECCION PRODUCTOS (RESULTDO VACIO) -->
    <section class="container pb-5" aria-label="Lista de productos">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4" id="cuadriculaCatalogo"></div>
      <p class="alert catalogo-vacio d-none" id="catalogoVacio" role="status">No encontramos nada con esa búsqueda. Prueba con otra palabra o quita el filtro.</p>
    </section>

    <!-- CUADRO DE DETALLE DE PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoTitulo">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h4" id="modalProductoTitulo">Detalle del producto</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="tarjeta-producto__arte mb-3" id="modalProductoArte"></div>
            <p id="modalProductoDescripcion"></p>
            <p class="precio mb-0" id="modalProductoPrecio"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary" id="modalProductoAgregar">Agregar al carrito</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="sc-pie"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/carrito.js"></script>
  <script src="../js/navegacion.js"></script>
  <script src="../js/cuenta.js"></script>
  <script src="../js/tarjetas.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
